<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Woonavi — Galaxy S26 interactive story</title>
<style>
:root{--paper:#fbfaf7;--ink:#26241f;--link:#2f6fd6;--font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.story{max-width:620px;margin:0 auto;padding:56px 22px 120px;font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;font-size:19px;line-height:1.75;letter-spacing:-.01em;word-break:keep-all;text-align:justify}.story h1{font-size:20px;margin:0 0 32px}.story p{margin:0;text-indent:1em}.phone-link{color:var(--link);text-decoration:none}
.phone-layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;visibility:hidden}.phone-layer.open{pointer-events:auto;visibility:visible}.backdrop{position:absolute;inset:0;background:rgba(4,7,13,.72);backdrop-filter:blur(10px);opacity:0;transition:.35s}.phone-layer.open .backdrop{opacity:1}.close-phone{position:absolute;top:18px;right:20px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px;z-index:3}
.gs-body{position:relative;width:386px;height:790px;padding:14px;border-radius:48px;background:linear-gradient(110deg,#737987,#171a20 8%,#080a0e 48%,#292e37 92%,#8d939f);box-shadow:0 0 0 1px #c4c8d0,0 0 0 4px #343842,0 38px 100px rgba(0,0,0,.6);opacity:0;transform:scale(.96);transition:.3s;color:#fff}.phone-layer.open .gs-body{opacity:1;transform:scale(1)}.gs-screen{position:relative;width:358px;height:762px;overflow:hidden;border-radius:38px;background:#05070b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.punch{position:absolute;z-index:60;top:12px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:#020307;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.sbar{position:absolute;top:0;left:0;right:0;height:30px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 17px;font-size:12px;color:#fff}.sb-right{display:flex;gap:7px;align-items:center}.bat{width:20px;height:10px;border:1.3px solid #fff;border-radius:3px;position:relative;padding:1px}.bat:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#fff}.bat i{display:block;height:100%;width:100%;background:#fff;border-radius:1px}
.screens{position:absolute;inset:0}.scr{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;overflow:hidden}.wall{position:absolute;inset:0;background:radial-gradient(85% 48% at 82% 20%,rgba(127,164,220,.38),transparent 60%),radial-gradient(100% 70% at 15% 82%,rgba(32,75,160,.45),transparent 62%),linear-gradient(145deg,#030711 8%,#101d38 43%,#02050c 67%,#0e1e3d 100%);overflow:hidden}.wall:before,.wall:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(190,215,255,.35);transform:rotate(-28deg);filter:blur(.2px)}.wall:before{width:540px;height:300px;right:-170px;top:95px;box-shadow:0 0 45px rgba(80,150,255,.18)}.wall:after{width:500px;height:280px;left:-220px;bottom:80px;box-shadow:0 0 50px rgba(70,120,255,.16)}
.lock{color:#fff;position:relative}.lk-top{text-align:center;padding-top:72px;position:relative;z-index:2}.lk-time{font-size:68px;font-weight:300;line-height:1;letter-spacing:-3px}.lk-date{margin-top:9px;font-size:15px;opacity:.9}.lk-msg{margin-top:22px;font-size:12px;opacity:.75}.lk-pat{position:absolute;left:0;right:0;bottom:54px;display:flex;flex-direction:column;align-items:center;z-index:2}.pat{position:relative;width:238px;height:238px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);touch-action:none;user-select:none}.pat svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pat polyline{fill:none;stroke:rgba(112,190,255,.9);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.pat i{align-self:center;justify-self:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(255,255,255,.3),0 3px 14px rgba(0,0,0,.35);pointer-events:none}.pat i.on{transform:scale(1.35);background:#fff;box-shadow:0 0 0 3px #4ca9ff,0 0 18px #4ca9ff}.lock-bottom{position:absolute;left:0;right:0;bottom:15px;display:flex;justify-content:space-between;padding:0 28px;color:#fff;z-index:2}.quick{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:20px}.gesture{position:absolute;z-index:60;bottom:8px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:3px;background:rgba(255,255,255,.85)}
.home{color:#fff;position:relative}.home-content{position:relative;z-index:2;flex:1;padding:55px 15px 8px}.home-header{display:flex;justify-content:space-between;align-items:end;margin:0 8px 14px}.home-time{font-size:42px;font-weight:300}.home-date{font-size:12px;opacity:.75}.weather{font-size:12px;text-align:right}.weather b{display:block;font-size:20px;font-weight:400}.widget{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.10);backdrop-filter:blur(14px);border-radius:20px;padding:14px;margin-bottom:17px}.widget-title{font-size:12px;opacity:.75;margin-bottom:7px}.widget-main{font-size:16px}.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 7px}.ap{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#fff;text-shadow:0 1px 5px #000}.ti{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);box-shadow:0 7px 18px rgba(0,0,0,.22);font-size:24px}.dock{position:relative;z-index:3;height:76px;margin:0 10px 18px;border-radius:25px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.tbar{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 13px;font-size:18px;background:rgba(10,12,17,.86);border-bottom:1px solid rgba(255,255,255,.12);z-index:2}.tbar button{font-size:30px;width:35px}.tbar small{margin-left:auto;font-size:11px;opacity:.6}.list{background:#080a0f;flex:1;overflow:auto}.row{display:flex;align-items:center;gap:12px;padding:12px;min-height:68px;border-bottom:1px solid #20242c}.row .ph{width:45px;height:45px;flex:none;border-radius:14px;background:linear-gradient(145deg,#4f6d96,#182235);display:grid;place-items:center;font-size:21px}.row .tx{flex:1}.row .tx b{display:block;font-size:15px;font-weight:500}.row .tx small{display:block;font-size:12px;color:#8f98a8;margin-top:3px}.row .rt{font-size:11px;color:#8790a0}.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0b0e14;border-bottom:1px solid #2d73ba}.tabs button{height:46px;color:#8f98a8}.tabs button.on{color:#fff}.conv{flex:1;background:#090b10;padding:10px;overflow:auto}.bub{display:flex;margin:7px 0}.bub.me{justify-content:flex-end}.bub .b{max-width:75%;padding:9px 12px;border-radius:16px;background:#252b35;font-size:14px}.bub.me .b{background:#2f82d9}.compose{display:flex;gap:6px;padding:7px;background:#11151c}.compose input{flex:1;height:40px;border-radius:20px;border:1px solid #343b47;background:#1c222b;color:#fff;padding:0 14px}.compose button{width:60px;border-radius:20px;background:#2f82d9;color:#fff}
.wb{background:#f3f5f8;color:#222;font-size:13px;flex:1;overflow:auto}.wb-top{background:#101827;color:#fff;padding:12px;display:flex;gap:8px}.wb-logo{font-size:18px;font-weight:700}.wb-search{flex:1;background:#fff;color:#999;border-radius:18px;padding:6px 10px}.wb-tabs{display:flex;background:#fff;border-bottom:1px solid #ddd}.wb-tabs>*{flex:1;text-align:center;padding:10px}.wb-tabs b{color:#1976d2;border-bottom:2px solid #1976d2}.wb-box{background:#fff;margin:7px;padding:10px;border-radius:12px}.wb-box h3{margin:0 0 7px;font-size:14px}.wb-news{display:block;padding:8px 0;border-top:1px solid #eee}.wb-news b{display:block}.wb-news small{color:#888}
@media(max-width:520px){.story{padding:35px 18px 80px;font-size:17px}.phone-layer{align-items:stretch}.gs-body{width:100%;height:100%;padding:0;border-radius:0;box-shadow:none;transform:none}.phone-layer.open .gs-body{transform:none}.gs-screen{width:100%;height:100%;border-radius:0}.close-phone{display:none}.punch{top:10px}}
</style>
</head>
<body>
<main class="story">
<h1>Woonavi — 낯선 휴대폰</h1>
<p>책상 위에 놓인 휴대폰의 화면이 희미하게 켜졌다. 이번에는 오래된 기기가 아니었다. 유리처럼 매끈한 화면과 얇은 금속 프레임이 어둠 속에서 빛났다.</p>
<p>손끝으로 <a class="phone-link" href="#" id="openPhone">휴대폰을 들어 올렸다.</a></p>
<p>짙은 남색과 은빛이 겹쳐지는 새로운 배경화면. 잠금이 풀리면 그 안에 무엇이 남아 있을까.</p>
</main>
<div class="phone-layer" id="phoneLayer" aria-hidden="true">
<div class="backdrop"></div><button class="close-phone" id="closePhone">×</button>
<div class="gs-body"><div class="gs-screen">
<div class="punch"></div><div class="sbar"><span>2:04</span><span class="sb-right">5G　Wi‑Fi <span class="bat"><i></i></span>100%</span></div>
<div class="screens">
<section class="scr lock" id="lock"><div class="wall"></div><div class="lk-top"><div class="lk-time">2:04</div><div class="lk-date">10월 23일 금요일</div><div class="lk-msg" id="patMsg">잠금을 해제하려면 패턴을 그리세요</div></div><div class="lk-pat"><div class="pat" id="pat"><svg><polyline id="patLine" points=""></polyline></svg><i data-n="1"></i><i data-n="2"></i><i data-n="3"></i><i data-n="4"></i><i data-n="5"></i><i data-n="6"></i><i data-n="7"></i><i data-n="8"></i><i data-n="9"></i></div></div><div class="lock-bottom"><button class="quick">⌁</button><button class="quick">⌂</button></div><div class="gesture"></div></section>
<section class="scr home" id="home" hidden><div class="wall"></div><div class="home-content"><div class="home-header"><div><div class="home-time">2:04</div><div class="home-date">금요일 · 10월 23일</div></div><div class="weather">맑음<b>18°</b></div></div><div class="widget"><div class="widget-title">Woonavi</div><div class="widget-main">사라진 기록을 찾으려면 앱을 확인하세요.</div></div><div class="app-grid"><button class="ap" data-app="messages"><span class="ti">✉</span>메시지</button><button class="ap" data-app="phone"><span class="ti">☎</span>전화</button><button class="ap" data-app="browser"><span class="ti">◎</span>인터넷</button><button class="ap" data-app="notes"><span class="ti">▤</span>메모</button><button class="ap" data-app="gallery"><span class="ti">▧</span>갤러리</button><button class="ap" data-app="music"><span class="ti">♫</span>음악</button><button class="ap" data-app="settings"><span class="ti">⚙</span>설정</button><button class="ap" data-app="gallery"><span class="ti">✦</span>사진</button></div></div><div class="dock"><button class="ap" data-app="phone"><span class="ti">☎</span></button><button class="ap" data-app="messages"><span class="ti">✉</span></button><button class="ap" data-app="browser"><span class="ti">◎</span></button><button class="ap" data-app="gallery"><span class="ti">▧</span></button></div><div class="gesture"></div></section>
<section class="scr" id="app"><div class="tbar"><button id="back">‹</button><span id="appTitle">앱</span><small id="appMeta"></small></div><div id="appBody" style="flex:1;min-height:0;display:flex;flex-direction:column"></div><div class="gesture"></div></section>
</div></div></div></div>
<script>
const layer=document.getElementById('phoneLayer'),openBtn=document.getElementById('openPhone'),closeBtn=document.getElementById('closePhone'),lock=document.getElementById('lock'),home=document.getElementById('home'),app=document.getElementById('app'),appTitle=document.getElementById('appTitle'),appBody=document.getElementById('appBody'),pat=document.getElementById('pat'),patLine=document.getElementById('patLine'),patMsg=document.getElementById('patMsg');
openBtn.onclick=e=>{e.preventDefault();layer.classList.add('open');layer.setAttribute('aria-hidden','false')};closeBtn.onclick=()=>{layer.classList.remove('open');layer.setAttribute('aria-hidden','true')};
function showHome(){lock.hidden=true;app.hidden=true;home.hidden=false}function showLock(){lock.hidden=false;home.hidden=true;app.hidden=true}function showApp(name){home.hidden=true;lock.hidden=true;app.hidden=false;render(name)}
document.getElementById('back').onclick=showHome;
document.querySelectorAll('.ap').forEach(b=>b.onclick=()=>showApp(b.dataset.app));
const data={
messages:{title:'메시지',html:'<div class="tabs"><button class="on">대화</button><button>연락처</button></div><div class="list"><div class="row"><div class="ph">👤</div><div class="tx"><b>김서윤</b><small>오늘은 꼭 연락해줘.</small></div><div class="rt">1:57</div></div><div class="row"><div class="ph">👤</div><div class="tx"><b>알 수 없는 번호</b><small>첨부 파일이 도착했습니다.</small></div><div class="rt">어제</div></div></div>'},
phone:{title:'전화',html:'<div class="list"><div class="row"><div class="ph">☎</div><div class="tx"><b>김서윤</b><small>010-1234-5678</small></div><div class="rt">부재중</div></div><div class="row"><div class="ph">☎</div><div class="tx"><b>알 수 없는 번호</b><small>02-0000-0000</small></div><div class="rt">어제</div></div></div>'},
browser:{title:'인터넷',html:'<div class="wb"><div class="wb-top"><span class="wb-logo">navi</span><div class="wb-search">검색어를 입력하세요</div></div><div class="wb-tabs"><b>홈</b><span>뉴스</span><span>실시간</span></div><div class="wb-box"><h3>실시간 인기 검색어</h3><div class="wb-news"><b>1. 오늘의 날씨</b><small>맑고 선선한 하루</small></div><div class="wb-news"><b>2. 사라진 기록</b><small>새로운 이야기가 올라왔습니다</small></div></div><div class="wb-box"><h3>뉴스</h3><div class="wb-news"><b>사라진 기록을 찾는 사람들</b><small>오후 1:30 · 모바일 기사</small></div></div></div>'},
notes:{title:'메모',html:'<div class="list"><div class="row"><div class="ph">▤</div><div class="tx"><b>잊지 말 것</b><small>창고 · 오래된 상자 · 10월 23일</small></div></div><div class="row"><div class="ph">▤</div><div class="tx"><b>전화가 오면</b><small>먼저 듣고 대답하기.</small></div></div></div>'},
gallery:{title:'갤러리',html:'<div class="list"><div class="row"><div class="ph">▧</div><div class="tx"><b>사진 6장</b><small>최근 항목</small></div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px"><div style="aspect-ratio:1;background:linear-gradient(135deg,#243a55,#9bb5d2)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#182d52,#6486bd)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#151a25,#5c6f91)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#1c3048,#6d93ba)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#26364d,#8ba7ca)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#0d1728,#4e6b9a)"></div></div></div>'},
music:{title:'음악',html:'<div style="flex:1;background:#080a0f;text-align:center;padding-top:35px"><div style="margin:0 auto;width:190px;height:190px;border-radius:24px;background:linear-gradient(135deg,#263c69,#080b13);display:flex;align-items:center;justify-content:center;font-size:64px">♫</div><h3>기억의 조각</h3><small style="color:#8992a2">Unknown Artist</small><div style="margin:30px 25px;height:4px;background:#303642"><i style="display:block;width:38%;height:100%;background:#4c9de8"></i></div><button style="font-size:38px">▶</button></div>'},
settings:{title:'설정',html:'<div class="list"><div class="row"><div class="tx"><b>소리 및 진동</b><small>벨소리, 진동, 알림</small></div><b>›</b></div><div class="row"><div class="tx"><b>디스플레이</b><small>밝기, 배경화면</small></div><b>›</b></div><div class="row"><div class="tx"><b>휴대전화 정보</b><small>Galaxy S26 스타일</small></div><b>›</b></div></div>'}
};
function render(name){const d=data[name]||data.settings;appTitle.textContent=d.title;appBody.innerHTML=d.html+(name==='messages'?'<div class="compose"><input placeholder="메시지 입력"><button>전송</button></div>':'')}
let seq=[],down=false;function resetPattern(ok=false){seq=[];pat.querySelectorAll('i').forEach(x=>x.classList.remove('on'));patLine.setAttribute('points','');patMsg.textContent=ok?'잠금 해제':'잠금을 해제하려면 패턴을 그리세요'}
function hit(e){const r=pat.getBoundingClientRect(),p=e.touches?e.touches[0]:e,x=p.clientX-r.left,y=p.clientY-r.top;if(x<0||y<0||x>r.width||y>r.height)return;const col=Math.floor(x/(r.width/3)),row=Math.floor(y/(r.height/3)),n=row*3+col+1;if(!seq.includes(n)){seq.push(n);pat.querySelector(`[data-n="${n}"]`).classList.add('on');const pts=seq.map(v=>{const c=(v-1)%3,rr=Math.floor((v-1)/3);return `${(c+.5)*r.width/3},${(rr+.5)*r.height/3}`}).join(' ');patLine.setAttribute('points',pts)}}
pat.addEventListener('pointerdown',e=>{down=true;pat.setPointerCapture(e.pointerId);resetPattern();hit(e)});pat.addEventListener('pointermove',e=>{if(down)hit(e)});pat.addEventListener('pointerup',()=>{down=false;if(seq.join('')==='1258'){patMsg.textContent='잠금 해제';setTimeout(showHome,220)}else{patMsg.textContent='패턴이 올바르지 않습니다';setTimeout(()=>resetPattern(),650)}});
</script>
</body></html>
