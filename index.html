</style>

<body>
<main class="story">
<h1>Woonavi — 오래된 휴대폰</h1>
<p>책상 위에 놓인 오래된 휴대폰의 화면이 희미하게 켜졌다. 화면을 눌러 잠금화면을 확인한다.</p>
<p>손끝으로 <a class="phone-link" href="#" id="openPhone">휴대폰을 들어 올렸다.</a></p>
<p>푸른 배경 위에 익숙한 아이콘들이 떠 있었다. 패턴을 입력하면 홈 화면으로 들어갈 수 있다.</p>
</main>

<div class="phone-layer" id="phoneLayer" aria-hidden="true">
<div class="backdrop"></div><button class="close-phone" id="closePhone" aria-label="닫기">×</button>
<div class="gs-body">
<div class="gs-top"><div class="gs-speaker"></div><div class="gs-cam"></div><div class="gs-sensor"></div></div>
<div class="gs-screen">
<div class="sbar"><span>2:04</span><span class="sb-right">Wi-Fi&nbsp; 4G <span class="bat"><i></i></span></span></div>
<div class="screens">
<section class="scr lock" id="lock">
<div class="wall"></div><div class="lk-clock"><div class="lk-time">2:04</div><div class="lk-date">10월 23일 금요일</div></div>
<div class="lk-pat"><p id="patMsg">패턴을 입력하세요</p><div class="pat" id="pat"><svg><polyline id="patLine" points=""></polyline></svg><i data-n="1"></i><i data-n="2"></i><i data-n="3"></i><i data-n="4"></i><i data-n="5"></i><i data-n="6"></i><i data-n="7"></i><i data-n="8"></i><i data-n="9"></i></div></div>
</section>
<section class="scr home" id="home" hidden>
<div class="wall"></div><div class="hm-dots"><i class="on">1</i><i>2</i></div><div class="hm-pages"><div class="hm-track"><div class="hm-page"><div class="wg wg-clock"><div><div class="t">2:04</div><div>금요일 · 10월 23일</div></div><div class="w">날씨<b>18°</b>맑음</div></div><button class="ap" data-app="messages"><span class="ti">✉</span>메시지</button><button class="ap" data-app="phone"><span class="ti">☎</span>전화</button><button class="ap" data-app="browser"><span class="ti">◎</span>인터넷</button><button class="ap" data-app="notes"><span class="ti">▤</span>메모</button><button class="ap" data-app="gallery"><span class="ti">▧</span>갤러리</button><button class="ap" data-app="music"><span class="ti">♫</span>음악</button><button class="ap" data-app="settings"><span class="ti">⚙</span>설정</button></div></div></div>
<div class="dock"><button class="ap" data-app="phone"><span class="ti">☎</span></button><button class="ap" data-app="messages"><span class="ti">✉</span></button><button class="ap" data-app="browser"><span class="ti">◎</span></button><button class="ap" data-app="gallery"><span class="ti">▧</span></button></div>
</section>
<section class="scr" id="app"><div class="tbar"><button id="back">‹</button><span id="appTitle">앱</span><small id="appMeta"></small></div><div id="appBody" style="flex:1;min-height:0;display:flex;flex-direction:column"></div></section>
</div></div>
<div class="gs-keys"><button class="gk" id="recent">▢</button><button class="gk" id="backKey">‹</button><button class="gk home" id="homeKey"><i></i></button></div>
</div></div>
<script>
const layer=document.getElementById('phoneLayer'),openBtn=document.getElementById('openPhone'),closeBtn=document.getElementById('closePhone'),lock=document.getElementById('lock'),home=document.getElementById('home'),app=document.getElementById('app'),appTitle=document.getElementById('appTitle'),appBody=document.getElementById('appBody'),pat=document.getElementById('pat'),patLine=document.getElementById('patLine'),patMsg=document.getElementById('patMsg');
openBtn.onclick=e=>{e.preventDefault();layer.classList.add('open');layer.setAttribute('aria-hidden','false')};closeBtn.onclick=()=>{layer.classList.remove('open');layer.setAttribute('aria-hidden','true')};
function showHome(){lock.hidden=true;app.hidden=true;home.hidden=false} function showLock(){lock.hidden=false;home.hidden=true;app.hidden=true} function showApp(name){home.hidden=true;lock.hidden=true;app.hidden=false;appTitle.textContent=name;render(name)}
document.getElementById('homeKey').onclick=showHome;document.getElementById('backKey').onclick=()=>{if(!app.hidden)showHome();else showLock()};document.getElementById('back').onclick=showHome;
const data={messages:{title:'메시지',html:'<div class="tabs"><button class="on">대화</button><button>연락처</button></div><div class="list"><div class="row"><div class="ph">👤</div><div class="tx"><b>김서윤</b><small>오늘은 꼭 연락해줘.</small></div><div class="rt">1:57</div></div><div class="row"><div class="ph">👤</div><div class="tx"><b>알 수 없는 번호</b><small>첨부 파일이 도착했습니다.</small></div><div class="rt">어제</div></div></div>'},browser:{title:'인터넷',html:'<div class="wb"><div class="wb-top"><span class="wb-logo">navi</span><div class="wb-search"><span>검색어를 입력하세요</span><i>검색</i></div></div><div class="wb-tabs"><b>홈</b><span>뉴스</span><span>실시간</span></div><div class="wb-box"><h3>실시간 인기 검색어</h3><div class="wb-news"><b>1. 오늘의 날씨</b><small>맑고 선선한 하루</small></div><div class="wb-news"><b>2. 오래된 휴대폰</b><small>새로운 이야기가 올라왔습니다</small></div></div><div class="wb-box"><h3>뉴스</h3><div class="wb-news"><b>사라진 기록을 찾는 사람들</b><small>오후 1:30 · 모바일 기사</small></div></div></div>'},notes:{title:'메모',html:'<div class="list"><div class="row"><div class="ph">▤</div><div class="tx"><b>잊지 말 것</b><small>창고 · 오래된 상자 · 10월 23일</small></div></div><div class="row"><div class="ph">▤</div><div class="tx"><b>전화가 오면</b><small>먼저 듣고 대답하기.</small></div></div></div>'},gallery:{title:'갤러리',html:'<div class="list"><div class="row"><div class="ph">▧</div><div class="tx"><b>사진 6장</b><small>최근 항목</small></div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px"><div style="aspect-ratio:1;background:linear-gradient(135deg,#243a55,#9bb5d2)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#493b2c,#c8a66a)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#151515,#666)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#1c3048,#6d93ba)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#40333d,#b27f8f)"></div><div style="aspect-ratio:1;background:linear-gradient(135deg,#28352a,#849b78)"></div></div></div>'},music:{title:'음악',html:'<div style="flex:1;background:#000;text-align:center;padding-top:35px"><div style="margin:0 auto;width:180px;height:180px;background:linear-gradient(135deg,#3b2a5c,#121019);display:flex;align-items:center;justify-content:center;font-size:60px">♫</div><h3>기억의 조각</h3><small style="color:#aaa">Unknown Artist</small><div style="margin:30px 25px;height:4px;background:#333"><i style="display:block;width:38%;height:100%;background:#3d9be9"></i></div><button style="font-size:38px">▶</button></div>'},phone:{title:'전화',html:'<div class="list"><div class="row"><div class="ph">☎</div><div class="tx"><b>김서윤</b><small>010-1234-5678</small></div><div class="rt">부재중</div></div><div class="row"><div class="ph">☎</div><div class="tx"><b>알 수 없는 번호</b><small>02-0000-0000</small></div><div class="rt">어제</div></div></div>'},settings:{title:'설정',html:'<div class="list"><div class="row"><div class="tx"><b>소리 및 알림</b><small>벨소리, 진동, 알림</small></div><b>›</b></div><div class="row"><div class="tx"><b>디스플레이</b><small>밝기, 배경화면</small></div><b>›</b></div><div class="row"><div class="tx"><b>휴대전화 정보</b><small>Android 2.x 스타일</small></div><b>›</b></div></div>'}};
function render(name){const d=data[name]||data.settings;appTitle.textContent=d.title;appBody.innerHTML=d.html+(name==='messages'?'<div class="compose"><input placeholder="메시지 입력"><button>전송</button></div>':'');}
document.querySelectorAll('.ap').forEach(b=>b.onclick=()=>showApp(b.dataset.app));
let seq=[],down=false;function resetPattern(ok=false){seq=[];pat.querySelectorAll('i').forEach(x=>x.classList.remove('on'));patLine.setAttribute('points','');patMsg.textContent=ok?'잠금 해제':'패턴을 입력하세요'}
function hit(e){const r=pat.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;const col=Math.floor(x/(r.width/3)),row=Math.floor(y/(r.height/3));if(col<0||col>2||row<0||row>2)return;const n=row*3+col+1;if(!seq.includes(n)){seq.push(n);pat.querySelector(`[data-n="${n}"]`).classList.add('on');const pts=seq.map(v=>{const c=(v-1)%3,rr=Math.floor((v-1)/3);return `${(c+.5)*r.width/3},${(rr+.5)*r.height/3}`}).join(' ');patLine.setAttribute('points',pts)}}
pat.addEventListener('pointerdown',e=>{down=true;pat.setPointerCapture(e.pointerId);resetPattern();hit(e)});pat.addEventListener('pointermove',e=>{if(down)hit(e)});pat.addEventListener('pointerup',()=>{down=false;if(seq.join('')==='1258'){patMsg.textContent='잠금 해제';setTimeout(showHome,220)}else{patMsg.textContent='패턴이 올바르지 않습니다';setTimeout(()=>resetPattern(),650)}});
</script>
